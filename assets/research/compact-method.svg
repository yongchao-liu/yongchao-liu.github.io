<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 430" width="640" height="430" role="img" aria-labelledby="title desc">
  <title id="title">Compact Computing: three cooperating components</title>
  <desc id="desc">Compressed, sparse and elastic data representations, tightly coupled architectures, and efficient scalable service-oriented algorithms are connected bidirectionally. The three components are co-designed, not sequential processing stages.</desc>
  <defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse"><path d="M1 1L9 5L1 9" fill="none" stroke="#004f9e" stroke-width="1.5"/></marker></defs>
  <g color="#004f9e" font-family="Arial, Helvetica, sans-serif">
<path d="M244 151L165 218" fill="none" stroke="currentColor" stroke-width="3" marker-start="url(#arrow)" marker-end="url(#arrow)"/>
<path d="M396 151L475 218" fill="none" stroke="currentColor" stroke-width="3" marker-start="url(#arrow)" marker-end="url(#arrow)"/>
<path d="M256 303H384" fill="none" stroke="currentColor" stroke-width="3" marker-start="url(#arrow)" marker-end="url(#arrow)"/>
<rect x="150" y="20" width="340" height="124" rx="16" fill="#edf4fb" stroke="#004f9e" stroke-width="2"/><text x="320" y="56" text-anchor="middle" fill="currentColor" font-size="25" font-weight="700">Data representation</text><text x="320" y="86" text-anchor="middle" fill="currentColor" font-size="19" font-weight="500">Compressed · sparse · elastic</text><text x="320" y="115" text-anchor="middle" fill="#526373" font-size="17" font-weight="400">Preserve structure and locality</text><rect x="12" y="228" width="234" height="145" rx="14" fill="#fff" stroke="#004f9e" stroke-width="2"/><rect x="394" y="228" width="234" height="145" rx="14" fill="#fff" stroke="#004f9e" stroke-width="2"/><text x="129" y="265" text-anchor="middle" fill="currentColor" font-size="24" font-weight="700">Architectures</text><text x="129" y="296" text-anchor="middle" fill="currentColor" font-size="18" font-weight="500">Tightly coupled</text><text x="129" y="328" text-anchor="middle" fill="#526373" font-size="17" font-weight="400">CPU · GPU · clusters</text><text x="511" y="265" text-anchor="middle" fill="currentColor" font-size="24" font-weight="700">Algorithms</text><text x="511" y="296" text-anchor="middle" fill="currentColor" font-size="18" font-weight="500">Efficient and scalable</text><text x="511" y="328" text-anchor="middle" fill="#526373" font-size="18" font-weight="400">Service-oriented</text><text x="320" y="202" text-anchor="middle" fill="currentColor" font-size="18" font-weight="700">CO-DESIGN</text><text x="320" y="408" text-anchor="middle" fill="#526373" font-size="18" font-weight="500">One methodology · three cooperating components</text>
  </g>
</svg>
